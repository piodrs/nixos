set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#282828,fg=#ebdbb2"

set -g status-left-length 30
set -g status-left "#[bg=#d65d0e,fg=#282828,bold] #S #[default] "
set -g status-right "#[fg=#928374] %d/%m/%Y #[fg=#d79921,bold] %H:%M "

setw -g window-status-format "#[fg=#928374] #I:#W "
setw -g window-status-current-format "#[fg=#fabd2f,bold] #I:#W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d65d0e"
set -g message-style "bg=#3c3836,fg=#fabd2f"
setw -g mode-style "bg=#d79921,fg=#282828"
